name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap fail-fast guard before spending CI minutes on every platform
  # build: catches "tagged before bumping the version" - a tag that
  # doesn't match workspace.package.version in Cargo.toml is almost always
  # a mistake, not an intentional re-release of the same version under a
  # new tag.
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Cargo.toml version
        run: |
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "Tag v$tag_version does not match Cargo.toml version $cargo_version"
            exit 1
          fi

  # Tier 1: full parity - daemon (mcp + serve), CLI, GUI, .deb, .rpm, and a
  # plain tarball for distros using neither package format. Both
  # architectures build natively (GitHub's arm64 Ubuntu runners are real
  # hardware, not cross-compilation), so cargo-deb/cargo-generate-rpm
  # detect the right target architecture on their own without any extra
  # flags.
  linux:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Install GTK4/libadwaita dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config build-essential
      - run: cargo build --workspace --release --locked

      - name: Build .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb -p nexusd --no-build

      - name: Build .rpm
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm -p crates/nexusd

      - name: Build plain tarball
        run: |
          mkdir -p dist
          tar -czf dist/nexuscontext-linux-${{ matrix.arch }}.tar.gz -C target/release nexusd nexus nexuscontext-gui

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp target/debian/*.deb artifacts/
          cp target/generate-rpm/*.rpm artifacts/
          cp dist/*.tar.gz artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: artifacts/*

  # Tier 2: CLI + full daemon (mcp + serve both work - Unix domain sockets
  # are native on macOS), no GTK/libadwaita attempt at all (nexus-gui is
  # Linux/GNOME-first by design, with no cfg gating to make it portable).
  # x86_64 (macos-13, Intel) was dropped once before after that runner
  # class hit an extended GitHub-side queue with no runner ever assigned
  # (~20min, confirmed via the API showing no runner_name at all) - back
  # in the matrix on the chance that's since improved; if it reproduces,
  # drop that one entry again rather than the whole tier (Rosetta 2 is
  # still a real fallback for Intel Mac users on the arm64 build either
  # way).
  # Unsigned/unnotarized binaries will hit Gatekeeper's quarantine flag on
  # download - real code-signing needs an Apple Developer ID and is its own
  # follow-up, not attempted here; documented in the release notes instead.
  macos:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-14
          - arch: x86_64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - run: cargo build --workspace --exclude nexus-gui --release --locked
      - name: Build tarball
        run: |
          mkdir -p dist
          tar -czf dist/nexuscontext-macos-${{ matrix.arch }}.tar.gz -C target/release nexusd nexus
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.tar.gz

  # Tier 3 (new): CLI + MCP mode only - no serve/GUI/background watcher.
  # See issue #16: `nexusd serve`'s control API is Unix-domain-socket-only
  # with no cross-platform abstraction, so that module (and the watcher
  # module it alone drives) is compiled out entirely on non-Unix targets
  # (crates/nexusd/src/main.rs) rather than attempted here - `nexusd mcp`
  # has no such dependency, and every MCP tool works fully without it.
  # arm64 (windows-11-arm) is a real, free-tier GitHub-hosted runner as of
  # 2025 - native build, not cross-compiled, same as Linux's arm64 tier.
  # Both architectures are genuinely first-run-on-real-CI here: this is
  # the first time this project has built for Windows at all, so treat any
  # failure here as real signal, not a fluke - see issue #16's own note
  # that this specifically needed CI feedback before it could be trusted.
  windows:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - run: cargo build --workspace --exclude nexus-gui --release --locked
      - name: Build zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/nexusd.exe, target/release/nexus.exe -DestinationPath dist/nexuscontext-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.zip

  # Fan-in: each platform job uploads its own artifacts independently, and
  # only this one job actually talks to the GitHub Release - multiple jobs
  # each calling `gh release create` against the same tag would race each
  # other creating/updating the same release.
  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    # The default GITHUB_TOKEN is read-only for repo contents unless a job
    # explicitly asks for write access - without this, creating the release
    # itself fails with "403 Resource not accessible by integration."
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            **Linux (x86_64, arm64)**: full parity - daemon (`mcp` + `serve`), CLI, GUI, GNOME extension support, systemd packaging. Choose `.deb`, `.rpm`, or the plain tarball depending on your distro.

            **macOS (Apple Silicon, Intel)**: CLI + full daemon (`nexus`, `nexusd` - both `mcp` and `serve`/control API work, Unix domain sockets are native here) - no GUI build for macOS. Unsigned binaries will need `xattr -d com.apple.quarantine <binary>` or a right-click-Open the first time, since these aren't notarized.

            **Windows (x86_64, arm64)**: new this release. `nexus` CLI + `nexusd mcp` only - every MCP tool works fully. `nexusd serve` (the control API, background watcher, GUI target) isn't supported yet on Windows; running it prints a clear error instead of failing to start. See [issue #16](https://github.com/devNalyx/NexusContext/issues/16) for why, and what a future `serve` port would need.
